plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.morgan.minimallauncher'
    compileSdk 34

    defaultConfig {
        applicationId "com.morgan.minimallauncher"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // GitHub builds sign with one kept key (see .github/workflows/build.yml), so each
    // new APK installs over the last. Local builds use Android's usual debug key.
    signingConfigs {
        debug {
            def kept = System.getenv("DEBUG_KEYSTORE")
            if (kept != null && new File(kept).exists()) {
                storeFile file(kept)
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        // Shrinking keeps the APK small: the Claude SDK and its JSON
        // library are large, and only a small part of them is used.
        debug {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    packaging {
        resources {
            excludes += [
                'META-INF/versions/9/module-info.class',
                'META-INF/native-image/**',
                'META-INF/licenses/**',
                'META-INF/LICENSE*',
                'META-INF/NOTICE*',
                'META-INF/DEPENDENCIES',
                'META-INF/INDEX.LIST'
            ]
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.leanback:leanback:1.0.0'
    // Claude (official Anthropic SDK)
    implementation 'com.anthropic:anthropic-java:3.2.0'
    // QR code for pairing the iPhone remote
    implementation 'com.google.zxing:core:3.5.3'
    // Built-in player for your TV provider's channels, films and series
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'
}
