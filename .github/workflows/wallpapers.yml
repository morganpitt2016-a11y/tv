name: Fetch wallpaper candidates

# One-off helper: downloads candidate landscape photos (Unsplash License)
# at 1920px so they can be reviewed and the best ones bundled into the app.
# Results are pushed to the `wallpaper-candidates` branch, not main.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download candidates
        run: |
          mkdir -p out
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          for id in rmX6kki4Ht4 N7snRVB4usc m07cD8ChI1A D3odArjJIzc XY9tbPYhR34 U_mKUrPMXW0 \
                    7Z94A-v9kvw OtokIOPILX8 HdgZMuaKUsk 11i8fNhgWFM aCusqffy5sY HzcCapUboxE \
                    T_YG9paUo5I IUUGhLfVUuk; do
            echo "== $id"
            page=$(curl -sS -L -A "$UA" -w "\n%{http_code}" "https://unsplash.com/photos/$id" || true)
            echo "  page: $(echo "$page" | tail -1)"
            img=$(echo "$page" | grep -oE 'https://images\.unsplash\.com/photo-[A-Za-z0-9_-]+' | head -1)
            echo "  image: ${img:-NOT FOUND}"
            [ -z "$img" ] && continue
            echo "$img" > "out/$id.url"
            echo -n "  download: "
            curl -sS -L -o "out/$id.jpg" -w "%{http_code} %{content_type} %{size_download}\n" "$img?w=1920&q=85&fm=jpg&fit=max" || true
          done
          ls -la out

      - name: Push to wallpaper-candidates branch
        run: |
          cd out
          git init -q -b wallpaper-candidates
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Wallpaper candidates (run ${{ github.run_number }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" wallpaper-candidates
