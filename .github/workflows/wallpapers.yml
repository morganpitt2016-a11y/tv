name: Fetch wallpaper candidates

# One-off helper: searches Wikimedia Commons for freely licensed mountain /
# lake / sunset photos, downloads 1920px versions plus their licence and
# author details, and pushes them to the `wallpaper-candidates` branch for
# review. The chosen ones are then bundled into the app.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Search and download
        shell: python
        run: |
          import json, os, urllib.parse, urllib.request
          UA = "MinimalTVLauncher/1.0 (https://github.com/morganpitt2016-a11y/tv; wallpaper picker)"
          QUERIES = [
              "Dolomites lake sunset reflection",
              "Mount Rainier reflection lake sunset",
              "Patagonia lake sunset mountains",
              "Glacier National Park lake sunset",
              "Banff lake sunset reflection",
              "Norway fjord sunset mountains reflection",
              "Swiss Alps lake sunset reflection",
              "Grand Teton reflection sunrise",
              "Lake Tahoe sunset mountains",
              "Mount Assiniboine Lake Magog sunset",
              "Hallstatt lake dusk",
              "mountain lake alpenglow",
          ]
          OK_LICENCES = ("cc0", "cc by", "cc-by", "public domain", "pd")
          os.makedirs("out", exist_ok=True)

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": UA})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read()

          seen, meta = set(), []
          for q in QUERIES:
              params = {
                  "action": "query", "format": "json", "generator": "search",
                  "gsrnamespace": "6", "gsrsearch": f"{q} filetype:bitmap", "gsrlimit": "20",
                  "prop": "imageinfo", "iiprop": "url|size|extmetadata", "iiurlwidth": "1920",
              }
              data = json.loads(get("https://commons.wikimedia.org/w/api.php?" + urllib.parse.urlencode(params)))
              pages = sorted(data.get("query", {}).get("pages", {}).values(), key=lambda p: p.get("index", 0))
              kept = 0
              for p in pages:
                  ii = (p.get("imageinfo") or [{}])[0]
                  w, h = ii.get("width", 0), ii.get("height", 0)
                  em = ii.get("extmetadata", {})
                  lic = em.get("LicenseShortName", {}).get("value", "")
                  title = p["title"]
                  if title in seen or w < 1920 or not (1.4 <= w / max(h, 1) <= 2.1):
                      continue
                  if not lic.lower().startswith(OK_LICENCES):
                      continue
                  seen.add(title)
                  n = len(meta)
                  fname = f"c{n:02d}.jpg"
                  try:
                      with open(f"out/{fname}", "wb") as f:
                          f.write(get(ii["thumburl"]))
                  except Exception as e:
                      print("download failed", title, e); continue
                  artist = em.get("Artist", {}).get("value", "")
                  meta.append({"file": fname, "title": title, "query": q, "width": w, "height": h,
                               "licence": lic, "artist": artist, "page": ii.get("descriptionurl")})
                  print(f"{fname}  {lic:14s} {w}x{h}  {title}")
                  kept += 1
                  if kept >= 3:
                      break
          json.dump(meta, open("out/meta.json", "w"), indent=1)
          print(len(meta), "candidates")

      - name: Push to wallpaper-candidates branch
        run: |
          cd out
          git init -q -b wallpaper-candidates
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Wallpaper candidates (run ${{ github.run_number }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" wallpaper-candidates
