name: Check build (no publish)

# Compiles the app and runs the unit tests only. Nothing is published, so no TV updates from this.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Compile
        run: gradle :app:assembleDebug > build.log 2>&1 || { tail -40 build.log; echo '----- compiler errors -----'; grep -E '^e: ' build.log | head -100; exit 1; }
      - name: Unit tests
        continue-on-error: true
        run: gradle :app:testDebugUnitTest
