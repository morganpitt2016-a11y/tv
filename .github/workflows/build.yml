name: Build debug APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Diagnose APK (signing + manifest, as the installer sees them)
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "build-tools dir: $BT"
          ls -la "$APK"
          sha256sum "$APK"
          echo "==== apksigner verify ===="
          "$BT/apksigner" verify --verbose --print-certs "$APK" || echo "apksigner exit code: $?"
          echo "==== aapt2 dump badging ===="
          "$BT/aapt2" dump badging "$APK" || echo "aapt2 badging exit code: $?"
          echo "==== aapt2 dump xmltree AndroidManifest.xml ===="
          "$BT/aapt2" dump xmltree "$APK" --file AndroidManifest.xml || echo "aapt2 xmltree exit code: $?"

      - name: Create release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Debug build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true

      # GitHub's release-asset download redirects through a signed S3 URL
      # with a long query string, which some TV-side downloader apps
      # mishandle. Also publish the same APK as a plain file committed to
      # the repo, so it can be fetched as a single-hop, redirect-free URL.
      - name: Publish APK as a plain raw-fetchable file
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/app-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/app-debug.apk
          git commit -m "Publish debug APK (run ${{ github.run_number }}) [skip ci]" || echo "No change to commit"
          git push origin HEAD:main
