name: Build debug APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      # Keep one signing key across builds (in GitHub's private build cache, never
      # in the repo), so every new APK installs as an update of the last one. The
      # scheduled TV-guide workflow restores it too, so the cache never expires.
      - name: Restore signing key
        id: signing
        uses: actions/cache@v4
        with:
          path: ~/signing/debug.keystore
          key: debug-signing-key-v2

      - name: Create signing key (first run only)
        if: steps.signing.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/signing
          keytool -genkeypair -keystore ~/signing/debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APKs
        run: DEBUG_KEYSTORE=$HOME/signing/debug.keystore gradle assembleDebug --stacktrace

      - name: Diagnose APK (signing + manifest, as the installer sees them)
        run: |
          for APK in app/build/outputs/apk/debug/app-debug.apk testapp/build/outputs/apk/debug/testapp-debug.apk; do
            BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
            echo "#### $APK ####"
            ls -la "$APK"
            sha256sum "$APK"
            echo "==== apksigner verify ===="
            "$BT/apksigner" verify --verbose --print-certs "$APK" || echo "apksigner exit code: $?"
            echo "==== aapt2 dump badging ===="
            "$BT/aapt2" dump badging "$APK" || echo "aapt2 badging exit code: $?"
          done

      - name: Create release with APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Debug build ${{ github.run_number }}
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            testapp/build/outputs/apk/debug/testapp-debug.apk
          make_latest: true

      # GitHub's release-asset download redirects through a signed S3 URL
      # with a long query string, which some TV-side downloader apps
      # mishandle. Also publish the same APKs as plain files committed to
      # the repo, so they can be fetched as single-hop, redirect-free URLs.
      - name: Publish APKs as plain raw-fetchable files
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/app-debug.apk
          cp testapp/build/outputs/apk/debug/testapp-debug.apk dist/testapp-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/app-debug.apk dist/testapp-debug.apk
          git commit -m "Publish debug APKs (run ${{ github.run_number }}) [skip ci]" || echo "No change to commit"
          git push origin HEAD:main
